name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: ci-medic-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server tests
    runs-on: ubuntu-latest

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -proot" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Set up bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-15 \
            --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch version-15
          bench get-app medic "$GITHUB_WORKSPACE"
          bench new-site test_site --db-root-password root --admin-password admin --install-app erpnext
          bench --site test_site install-app medic
          # Completes ERPNext's setup (company, accounts, price lists) the medic tests build on.
          bench --site test_site execute erpnext.setup.utils.before_tests
        env:
          CI: "Yes"

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        # The tests build their own fixtures, so ERPNext's test records are not needed.
        run: bench --site test_site run-tests --app medic --skip-test-records
        env:
          CI: "Yes"
